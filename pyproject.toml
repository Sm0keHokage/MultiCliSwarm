[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multicliswarm"
version = "1.1.0"
description = "Enterprise Autonomous AI Ecosystem with Performance Benchmarking, Consensus Review, and Cloud Deploy."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Denis Sipicyn", email = "dshp@themezex.ru"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pathspec>=0.11.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "duckduckgo-search>=6.0.0",
    "playwright>=1.40.0",
    "PyGithub>=2.1.0",
    "tenacity>=8.2.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0"
]

[project.scripts]
multicliswarm = "multicliswarm.cli:main"
multicliswarm-mcp = "multicliswarm.mcp_server:main"
multicliswarm-ui = "multicliswarm.web_ui:main"
multicliswarm-ci = "multicliswarm.ci_cd_handler:main"
multicliswarm-bridge = "multicliswarm.ide_bridge:main"
